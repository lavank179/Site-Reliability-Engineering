services:
  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:latest
    volumes:
      - /var/log:/var/log
    command: -config.file=/etc/promtail/config.yml

  grafana:
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_FEATURE_TOGGLES_ENABLE=alertingSimplifiedRouting,alertingQueryAndExpressionsStepMode
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /etc/grafana/provisioning/datasources
        cat <<EOF > /etc/grafana/provisioning/datasources/ds.yaml
        apiVersion: 1
        datasources:
        - name: Loki
          type: loki
          access: proxy 
          orgId: 1
          url: http://loki:3100
          basicAuth: false
          isDefault: true
          version: 1
          editable: false
        EOF
        /run.sh
    image: grafana/grafana:latest
    ports:
      - "9991:3000"

  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    expose:
      - 9100
    ports:
      - "9100:9100"

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    user: "1000:1000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # - /media/homepc/FILES/lavan-practice/grafana-prometheus-monitoring/prometheus_data:/prometheus
      # - "/media/homepc/FILES/lavan-practice/grafana-prometheus-monitoring/prometheus.yml:/etc/prometheus/prometheus.yml"
      # - "/media/homepc/FILES/lavan-practice/grafana-prometheus-monitoring/prometheus-data:/prometheus"
      - /home/ramlavan/Desktop/lavan-practice/grafana-prometheus-monitoring/prometheus_data:/prometheus
      - /home/ramlavan/Desktop/lavan-practice/grafana-prometheus-monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - /home/ramlavan/Desktop/lavan-practice/grafana-prometheus-monitoring/rules.yml:/etc/prometheus/rules.yml

